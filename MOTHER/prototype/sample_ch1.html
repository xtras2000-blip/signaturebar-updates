<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MOTHER — CH1 샘플</title>
<style>
 * { box-sizing:border-box; margin:0; -webkit-tap-highlight-color:transparent; }
 html, body { height:100%; }
 body { background:#101116; color:#F2EFE8; display:flex; align-items:center; justify-content:center; overflow:hidden;
   font-family:"Apple SD Gothic Neo",Pretendard,"Noto Sans KR","Malgun Gothic",sans-serif; }
 #app { position:relative; width:100vw; height:100dvh; overflow:hidden; background:#101116; }
 @media (min-aspect-ratio: 3/4) { #app { width:min(46dvh,430px); height:min(100dvh,932px); border-radius:24px; box-shadow:0 30px 80px rgba(0,0,0,.6); } }

 #photo { position:absolute; inset:0; background:#101116 center/cover no-repeat; transition:opacity .9s ease; }
 #photo.fade { opacity:0; }
 .veil { position:absolute; inset:0; background:linear-gradient(180deg, rgba(16,17,22,.34) 0%, rgba(16,17,22,0) 30%, rgba(16,17,22,.05) 55%, rgba(16,17,22,.86) 100%); }
 .grain { position:absolute; inset:0; opacity:.4; mix-blend-mode:overlay; pointer-events:none;
   background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2"/><feColorMatrix type="matrix" values="0 0 0 0 0.6 0 0 0 0 0.6 0 0 0 0 0.6 0 0 0 0.05 0"/></filter><rect width="180" height="180" filter="url(%23n)"/></svg>');}

 .datechip { position:absolute; top:calc(48px + env(safe-area-inset-top)); left:0; right:0; text-align:center;
   font-size:12px; letter-spacing:.14em; color:rgba(242,239,232,.75); text-shadow:0 1px 8px rgba(16,17,22,.8); z-index:3; }

 .sheet { position:absolute; left:10px; right:10px; bottom:12px; z-index:5; display:grid; gap:8px; }
 .narr { background:rgba(251,250,246,.94); color:#2B2B33; border-radius:14px; padding:14px 17px;
   font-size:14px; line-height:1.75; box-shadow:0 8px 26px rgba(16,17,22,.35); }
 .narr .l2 { display:block; margin-top:6px; color:rgba(43,43,51,.72); }
 .choices { display:grid; gap:7px; }
 .choice { background:#FBFAF6; border:1.5px solid rgba(43,43,51,.24); border-radius:12px; min-height:46px;
   display:flex; align-items:center; padding:0 16px; font-size:13.5px; font-weight:600; color:#2B2B33; cursor:pointer; }
 .choice:active { transform:scale(.985); }
 .dolgrid { display:grid; grid-template-columns:1fr 1fr; gap:7px; }
 .tap-hint { text-align:center; font-size:11px; letter-spacing:.12em; color:rgba(242,239,232,.5); padding-bottom:2px; }

 /* 앨범 */
 #album { position:absolute; inset:0; background:#14161B; z-index:20; display:none; flex-direction:column;
   padding:calc(54px + env(safe-area-inset-top)) 18px calc(24px + env(safe-area-inset-bottom)); overflow-y:auto; }
 #album.on { display:flex; }
 #album h2 { font-size:19px; font-weight:800; }
 #album .sub { font-size:12.5px; color:#8B8E99; margin:4px 0 18px; }
 .albumgrid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
 .amem { border-radius:12px; overflow:hidden; background:#1E2128; }
 .amem img { width:100%; aspect-ratio:4/3.4; object-fit:cover; display:block; }
 .amem .cap { font-size:11px; color:#A6A8B0; padding:7px 9px 9px; line-height:1.5; }
 #album .fin { margin-top:22px; text-align:center; color:#C9C7C0; font-size:13.5px; line-height:1.9; }
 #album .fin b { font-family:"Iowan Old Style",Georgia,serif; letter-spacing:.1em; font-size:16px; color:#F2EFE8; }
 .replay { margin:18px auto 0; padding:11px 28px; border-radius:999px; border:1px solid rgba(233,231,225,.4);
   background:none; color:#E9E7E1; font-size:13px; cursor:pointer; display:block; }
</style>
</head>

const STEPS = [{"img": "a1_first_cry", "date": "출산의 날", "lines": ["울음이 먼저 들렸습니다.", "그 소리에, 열 달이 한꺼번에 지나갔습니다."]}, {"img": "a2_small_hand", "date": "출산의 날", "lines": ["손가락 하나를 내밀자<br>온 힘으로 쥐었습니다."]}, {"img": "a4_wristband_naming", "date": "생후 1일", "lines": ["손목의 작은 이름표.", "오래 고민했던 그 이름이<br>이제 한 사람의 것이 되었습니다."]}, {"img": "b12_night_care", "date": "생후 21일 · 새벽 3시", "lines": ["오늘도 새벽 세 시.", "수유등 아래에서는<br>시간이 다르게 흐릅니다."]}, {"img": "c_01m_eye_contact", "date": "생후 1개월", "lines": ["처음으로, 눈이 마주쳤습니다.", "나를 보고 있다.<br>확실히, 나를."]}, {"img": "c_02m_first_smile", "date": "생후 47일 · 낮", "lines": ["빨래를 걷다가 돌아본 순간 —", "웃었습니다. 나를 보고, 처음으로."], "choices": [{"t": "마주 웃는다", "r": "사진은 없다. 눈에 담는 시간이 길다.", "tag": "first_smile"}, {"t": "동영상부터 찍는다", "r": "영상 속 웃음은 삼 초. 손 떨림이 그대로 담겼다.", "tag": "first_smile_video"}, {"t": "남편에게 전화한다", "r": "통화가 끊긴 뒤에도 아이는 웃고 있다.", "tag": "first_smile_call"}]}, {"img": "d1_dawn_cry", "date": "생후 3개월 · 새벽", "lines": ["새벽에 갑자기 울음이 터졌습니다.", "이유는 알 수 없습니다.<br>알 수 없다는 게 제일 무섭습니다."], "choices": [{"t": "바로 안아 올린다", "r": "품에 닿자 울음이 조금씩 잦아든다. 팔이 저려온다.", "tag": "dawn_hold"}, {"t": "잠시 기다려 본다", "r": "삼 분이 삼십 분 같다. 결국 안았다.", "tag": "dawn_wait"}]}, {"img": "c_06m_babyfood", "date": "생후 6개월", "lines": ["첫 이유식.", "절반은 턱받이에, 절반은 바닥에.<br>입에 들어간 건 한 숟갈이었습니다."]}, {"img": "c_12m_doljanchi", "date": "생후 12개월 · 돌잔치", "lines": ["돌상 앞, 카메라 여섯 대.", "아이의 손이 천천히 움직입니다."], "doljabi": [{"t": "실", "r": "실을 잡았습니다. 어른들이 웃으며 박수를 칩니다.<br>'오래오래 건강하게.'"}, {"t": "연필", "r": "연필을 잡았습니다. 할머니가 제일 크게 웃습니다.<br>'공부머리네, 공부머리.'"}, {"t": "지폐", "r": "지폐를 잡았습니다. 박수와 웃음이 터집니다.<br>'부자 되겠네!'"}, {"t": "마이크", "r": "마이크를 잡고 놓지 않습니다.<br>온 가족이 오늘 제일 크게 웃었습니다."}]}, {"img": "i1_mom_calling", "date": "생후 24개월", "lines": ["'이리 와. 엄마한테 와.'", "두 팔을 벌리고 기다립니다."]}, {"img": "i2_step_one", "date": "생후 24개월", "lines": ["한 걸음.", "넘어질 듯, 넘어지지 않고."]}, {"img": "i5_hug", "date": "생후 24개월", "lines": ["품 안으로 들어왔습니다.", "엄마에게는 평범한 하루가 아니라,<br>평생 잊지 못할 하루였습니다."]}];
let idx = -1, lineIdx = 0, locked = false;
const seen = [];
let childName = '지우';
try { const s = JSON.parse(localStorage.getItem('mother_save')||'{}'); if (s.child && s.child.name) childName = s.child.name; } catch(e) {}

function setPhoto(name){
  const ph = document.getElementById('photo');
  ph.classList.add('fade');
  setTimeout(() => { ph.style.backgroundImage = 'url(data:image/jpeg;base64,' + IMGS[name] + ')'; ph.classList.remove('fade'); }, 450);
}
function render(){
  const st = STEPS[idx];
  document.getElementById('dateChip').textContent = st.date;
  const sheet = document.getElementById('sheet');
  const line = st.lines[lineIdx].replaceAll('지우', childName);
  let html = '<div class="narr">' + line + '</div>';
  const last = lineIdx === st.lines.length - 1;
  if (last && st.choices) {
    html += '<div class="choices">' + st.choices.map((c,i) =>
      '<button class="choice" onclick="event.stopPropagation(); pick(' + i + ')">' + c.t + '</button>').join('') + '</div>';
  } else if (last && st.doljabi) {
    html += '<div class="dolgrid">' + st.doljabi.map((c,i) =>
      '<button class="choice" onclick="event.stopPropagation(); doljabi(' + i + ')">' + c.t + '</button>').join('') + '</div>';
  } else {
    html += '<div class="tap-hint">탭</div>';
  }
  sheet.innerHTML = html;
}
function advance(){
  if (locked) { locked = false; return nextStep(); }
  if (idx >= 0) {
    const st = STEPS[idx];
    if (lineIdx < st.lines.length - 1) { lineIdx++; return render(); }
    if (st.choices || st.doljabi) return;   // 선택 대기
  }
  nextStep();
}
function nextStep(){
  idx++;
  if (idx >= STEPS.length) return openAlbum();
  lineIdx = 0;
  const st = STEPS[idx];
  seen.push(st);
  setPhoto(st.img);
  setTimeout(render, 250);
}
function pick(i){
  const st = STEPS[idx];
  const c = st.choices[i];
  document.getElementById('sheet').innerHTML =
    '<div class="narr">' + c.r + '</div><div class="tap-hint">탭</div>';
  locked = true;
}
function doljabi(i){
  const st = STEPS[idx];
  const c = st.doljabi[i];
  document.getElementById('sheet').innerHTML =
    '<div class="narr">' + c.r + '</div><div class="tap-hint">탭</div>';
  locked = true;
}
function openAlbum(){
  const g = document.getElementById('albumGrid');
  g.innerHTML = seen.map(s =>
    '<div class="amem"><img src="data:image/jpeg;base64,' + IMGS[s.img] + '"><div class="cap">' + s.date + '</div></div>').join('');
  document.querySelector('#album h2').textContent = childName + '의 앨범';
  document.getElementById('album').classList.add('on');
}
nextStep();
</script>
